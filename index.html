<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ERP Inventario</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-boxes-stacked"></i>
            <span>Inventory of Grymacxs</span>
        </div>

        <ul>

            <li class="active">
                <i class="fa-solid fa-chart-line"></i>
                Dashboard
            </li>

            <li>
                <i class="fa-solid fa-box"></i>
                Productos
            </li>

            <li>
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
                Movimientos
            </li>

            <li>
                <i class="fa-solid fa-camera"></i>
                Escáner
            </li>

            <li>
                <i class="fa-solid fa-file"></i>
                Reportes
            </li>

        </ul>

    </aside>

    <!-- CONTENIDO -->

    <main class="contenido">

        <!-- NAVBAR -->

        <div class="topbar">

            <h2>Costos Promedio </h2>

            <div class="usuario">

                <i class="fa-solid fa-user"></i>
                Admin

            </div>

        </div>

        <!-- STATS -->

        <div class="stats">

            <div class="card-stat">

                <div>
                    <h3 id="productosCount">0</h3>
                    <p>Productos</p>
                </div>

                <i class="fa-solid fa-box"></i>

            </div>

            <div class="card-stat">

                <div>
                    <h3 id="movimientosCount">0</h3>
                    <p>Movimientos</p>
                </div>

                <i class="fa-solid fa-chart-column"></i>

            </div>

            <div class="card-stat">

                <div>
                    <h3 id="inventarioTotal">$0</h3>
                    <p>Inventario</p>
                </div>

                <i class="fa-solid fa-dollar-sign"></i>

            </div>

        </div>

        <!-- PANEL -->
<div class="grafica-container">

    <canvas id="graficaInventario"></canvas>

</div>
 <div class="scanner-container mb-4">

    <div class="d-flex justify-content-between mb-3">

        <h4>Escáner de Productos</h4>

        <button
        class="btn btn-primary"
        onclick="iniciarScanner()">

            Iniciar Cámara

        </button>

    </div>

    <div id="reader"></div>

</div>
<div class="panel">

            <!-- FORMULARIO -->

            <div class="formulario">

                <div class="row g-3">
                    <div class="col-md-2 d-grid">

    <button
    class="btn btn-primary"
    onclick="exportarExcel()">

        Exportar Excel

    </button>

</div>

                    <div class="col-md-2">

                        <input type="date"
                        id="fecha"
                        class="form-control">

                    </div>

                    <div class="col-md-2">

                        <input type="text"
                        id="producto"
                        class="form-control"
                        placeholder="Producto">

                    </div>

                    <div class="col-md-2">

                        <input type="text"
                        id="concepto"
                        class="form-control"
                        placeholder="Concepto">

                    </div>

                    <div class="col-md-2">

                        <input type="number"
                        id="cantidad"
                        class="form-control"
                        placeholder="Cantidad">

                    </div>

                    <div class="col-md-2">

                        <input type="number"
                        id="costo"
                        class="form-control"
                        placeholder="Costo">

                    </div>

                    <div class="col-md-2 d-grid">

                        <button
                        class="btn btn-success"
                        onclick="registrarEntrada()">

                            Entrada

                        </button>

                    </div>

                    <div class="col-md-2 d-grid">

                        <button
                        class="btn btn-danger"
                        onclick="registrarSalida()">

                            Salida

                        </button>

                    </div>

                </div>

            </div>

            <!-- TABLA -->
           <div class="filtros mb-4">

    <div class="row">

        <div class="col-md-4">

            <input
            type="text"
            id="buscador"
            class="form-control"
            placeholder="Buscar producto..."
            onkeyup="filtrarTabla()">

        </div>

    </div>

</div>
            <div class="tabla">

                <table class="table align-middle">

                    <thead>

                        <tr>

                            <th>Fecha</th>
                            <th>Producto</th>
                            <th>Concepto</th>
                            <th>Entrada</th>
                            <th>Salida</th>
                            <th>Existencia</th>
                            <th>Costo</th>
                            <th>Promedio</th>
                            <th>Debe</th>
                            <th>Haber</th>
                            <th>Saldo</th>
                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody id="tablaBody">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>
<!-- Toastify -->

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script type="module"
src="firebase-sync.js"></script>
<script src="app.js"></script>
</body>
</html>
